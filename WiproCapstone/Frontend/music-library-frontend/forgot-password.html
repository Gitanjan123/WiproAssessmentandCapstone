<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melodia — Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/custom.css"/>
</head>
<body class="auth-bg min-h-screen flex items-center justify-center">

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="glass-card w-full max-w-md mx-4 p-10 rounded-3xl">

    <div class="text-center mb-8">
      <div class="logo-icon mx-auto mb-4">♪</div>
      <h1 class="font-display text-3xl text-amber-400 tracking-tight">Forgot Password</h1>
      <p class="text-zinc-400 text-sm mt-2 font-body">
        Enter your email and we'll send you a reset link
      </p>
    </div>

    <div id="forgotAlert" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

    <!-- Step 1: Email input -->
    <div id="step1" class="space-y-5">
      <div>
        <label class="block text-xs text-zinc-400 mb-2 uppercase tracking-widest font-body">
          Email Address
        </label>
        <input id="forgotEmail" type="email" placeholder="you@example.com"
          class="input-field w-full px-4 py-3 rounded-xl text-white text-sm font-body"/>
      </div>
      <button onclick="handleForgotPassword()" id="sendBtn"
        class="btn-primary w-full py-3 rounded-xl font-body font-medium text-sm">
        Send Reset Link
      </button>
    </div>

    <!-- Step 2: Success screen -->
    <div id="step2" class="hidden text-center">
      <div style="font-size:48px;margin-bottom:16px">📧</div>
      <h2 class="font-display text-xl text-amber-400 mb-3">Check Your Email</h2>
      <p class="text-zinc-400 text-sm font-body mb-6">
        If an account exists for
        <strong id="sentToEmail" class="text-white"></strong>,
        a reset link has been sent.
      </p>
      <button onclick="showStep1()" class="btn-secondary text-sm font-body"
        style="padding:10px 20px">
        Try a different email
      </button>
    </div>

    <div class="divider my-6"></div>

    <p class="text-center text-zinc-400 text-sm font-body">
      Remember your password?
      <a href="./index.html" class="text-amber-400 hover:text-amber-300 transition-colors ml-1">
        Back to Login
      </a>
    </p>
  </div>

  <script src="./js/api.js"></script>
  <script>
    async function handleForgotPassword() {
      const email = document.getElementById('forgotEmail')?.value?.trim();

      if (!email) {
        showForgotAlert('Please enter your email address.', 'error'); return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showForgotAlert('Please enter a valid email address.', 'error'); return;
      }

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px;vertical-align:middle"></span> Sending…`;

      try {
        // When backend ready: await POST('/auth/forgot-password', { email }, false);
        await new Promise(r => setTimeout(r, 1000)); // simulate network

        document.getElementById('sentToEmail').textContent = email;
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        document.getElementById('forgotAlert').classList.add('hidden');
      } catch (err) {
        showForgotAlert(err.message || 'Something went wrong. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }

    function showStep1() {
      document.getElementById('step1').classList.remove('hidden');
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('forgotEmail').value = '';
    }

    function showForgotAlert(msg, type) {
      const el = document.getElementById('forgotAlert');
      el.textContent = msg;
      el.className = `mb-4 p-3 rounded-xl text-sm text-center font-body alert-${type}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    }

    document.getElementById('forgotEmail')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleForgotPassword();
    });
  </script>
</body>
</html>
