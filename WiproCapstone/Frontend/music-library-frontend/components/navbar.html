<nav class="sticky top-0 z-50 flex items-center
            justify-between px-6 py-3
            bg-zinc-900/90 backdrop-blur-md
            border-b border-zinc-800">

  <!-- Left Side -->
  <div class="flex items-center gap-3">
    <button onclick="toggleSidebar()"
      class="md:hidden flex items-center justify-center
             w-9 h-9 rounded-lg bg-zinc-800
             border border-zinc-700
             text-zinc-300 hover:text-white
             hover:bg-zinc-700 transition-all">
      ☰
    </button>
    <h2 id="navbarTitle"
      class="text-base font-medium text-white
             tracking-tight">
      Song Library
    </h2>
  </div>

  <!-- Right Side -->
  <div class="flex items-center gap-3">
    <!-- Search -->
    <div class="hidden md:flex items-center gap-2
                bg-zinc-800 border border-zinc-700
                rounded-xl px-3 py-2 min-w-[220px]">
      <img src="../../assets/icons/search.png"
           style="width:14px;height:14px;
                  filter:brightness(0) invert(0.5)"
           onerror="this.outerHTML='<span style=color:#71717a;font-size:13px>🔍</span>'"/>
      <input type="text"
        id="navbarSearch"
        placeholder="Search songs…"
        oninput="handleNavSearch(this.value)"
        class="bg-transparent border-none outline-none
               text-white text-sm placeholder-zinc-500
               w-full"/>
    </div>

    <!-- Notification Bell -->
    <button onclick="goToNotifications()"
      class="relative flex items-center justify-center
             w-9 h-9 rounded-xl bg-zinc-800
             border border-zinc-700
             hover:bg-zinc-700 transition-all"
      title="Notifications">
      <img src="../../assets/icons/musical-note.png"
           style="width:16px;height:16px;
                  filter:brightness(0) invert(1)"
           onerror="this.outerHTML='🔔'"/>
      <span id="notifBadge"
        class="hidden absolute top-1.5 right-1.5
               w-2 h-2 rounded-full bg-amber-400">
      </span>
    </button>

    <!-- User Pill -->
    <button onclick="goToProfile()"
      class="flex items-center gap-2
             bg-zinc-800 border border-zinc-700
             rounded-xl px-3 py-1.5
             hover:bg-zinc-700 transition-all">
      <div id="navAvatar"
        class="w-7 h-7 rounded-full flex items-center
               justify-center text-xs font-bold
               text-yellow-900 flex-shrink-0"
        style="background:linear-gradient(
               135deg,#f59e0b,#d97706)">
        U
      </div>
      <span id="navUserName"
        class="hidden sm:block text-sm font-medium
               text-white">
        User
      </span>
    </button>
  </div>
</nav>
