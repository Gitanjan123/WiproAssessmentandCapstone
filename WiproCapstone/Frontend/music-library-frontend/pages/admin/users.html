<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Library Admin — Manage Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Playfair Display', serif; }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #3f3f46;
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-zinc-950 text-white">
<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="fixed top-0 left-0 z-40 w-60 h-screen
                flex flex-col bg-zinc-900
                border-r border-zinc-800 px-4 py-6">
    <div class="flex items-center gap-3 pb-6 mb-6
                border-b border-zinc-800">
      <div class="w-9 h-9 rounded-xl flex items-center
                  justify-center text-lg font-bold
                  text-white flex-shrink-0"
           style="background:linear-gradient(135deg,#7c3aed,#4f46e5)">
        ⚙
      </div>
      <span class="font-display text-lg"
            style="color:#a78bfa">Admin Panel</span>
    </div>

    <p class="text-[10px] uppercase tracking-widest
              text-zinc-500 px-2 mb-2">Admin Panel</p>

    <a href="dashboard.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              text-zinc-400 hover:text-white
              hover:bg-zinc-800 transition-all">
      <span class="w-5 text-center">📊</span>Dashboard
    </a>
    <a href="songs.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              text-zinc-400 hover:text-white
              hover:bg-zinc-800 transition-all">
      <span class="w-5 text-center">🎵</span>Manage Songs
    </a>
    <a href="users.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              bg-violet-400/10 text-violet-400
              border border-violet-400/20">
      <span class="w-5 text-center">👥</span>Manage Users
    </a>
    <a href="notifications.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              text-zinc-400 hover:text-white
              hover:bg-zinc-800 transition-all">
      <span class="w-5 text-center">🔔</span>Notifications
    </a>

    <div class="mt-auto pt-4 border-t border-zinc-800">
      <div class="flex items-center gap-3 px-3 py-2.5
                  bg-zinc-800 rounded-xl mb-3">
        <div id="sidebarAvatar"
             class="w-8 h-8 rounded-full flex items-center
                    justify-center text-xs font-bold
                    text-white flex-shrink-0"
             style="background:linear-gradient(135deg,#7c3aed,#4f46e5)">
          A
        </div>
        <div class="min-w-0">
          <p id="sidebarUserName"
             class="text-sm font-medium text-white truncate">
            Admin
          </p>
          <p id="sidebarUserRole"
             class="text-[10px] uppercase tracking-wider
                    text-zinc-500">Admin</p>
        </div>
      </div>
      <button onclick="handleLogout()"
        class="w-full flex items-center gap-3 px-3 py-2.5
               rounded-xl text-red-400 hover:text-red-300
               hover:bg-red-400/10 transition-all
               text-sm font-medium">
        <span class="w-5 text-center">↩</span>Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="ml-60 flex-1 p-8">

    <!-- Header -->
    <div class="flex items-center justify-between
                flex-wrap gap-4 mb-8">
      <div>
        <h1 class="font-display text-3xl text-white mb-1">
          Manage Users
        </h1>
        <p class="text-zinc-400 text-sm"
           id="userCount">Loading…</p>
      </div>
      <div class="flex items-center gap-3">
        <!-- Search -->
        <div class="flex items-center gap-2
                    bg-zinc-800 border border-zinc-700
                    rounded-xl px-4 py-2.5">
          <span class="text-zinc-500">🔍</span>
          <input type="text" id="userSearch"
            placeholder="Search users…"
            oninput="searchUsers()"
            class="bg-transparent border-none outline-none
                   text-white text-sm placeholder-zinc-500
                   w-44"/>
        </div>
        <!-- Create Admin Button -->
        <button onclick="openCreateAdminModal()"
          class="flex items-center gap-2 px-5 py-2.5
                 rounded-xl text-sm font-semibold
                 text-white transition-all hover:opacity-90"
          style="background:linear-gradient(135deg,#7c3aed,#4f46e5)">
          + Create Admin
        </button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 mb-6">
      <button onclick="showTab('all')" id="tabAll"
        class="px-4 py-2 rounded-xl text-sm font-medium
               bg-violet-400/10 text-violet-400
               border border-violet-400/20">
        All Users
      </button>
      <button onclick="showTab('admins')" id="tabAdmins"
        class="px-4 py-2 rounded-xl text-sm font-medium
               text-zinc-400 hover:text-white
               hover:bg-zinc-800 transition-all">
        Admins Only
      </button>
      <button onclick="showTab('users')" id="tabUsers"
        class="px-4 py-2 rounded-xl text-sm font-medium
               text-zinc-400 hover:text-white
               hover:bg-zinc-800 transition-all">
        Users Only
      </button>
    </div>

    <!-- Users Table -->
    <div class="bg-zinc-900 border border-zinc-800
                rounded-2xl overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="border-b border-zinc-800">
            <th class="text-left px-5 py-3.5 text-xs
                       uppercase tracking-wider
                       text-zinc-500 font-medium">Name</th>
            <th class="text-left px-5 py-3.5 text-xs
                       uppercase tracking-wider
                       text-zinc-500 font-medium">Email</th>
            <th class="text-left px-5 py-3.5 text-xs
                       uppercase tracking-wider
                       text-zinc-500 font-medium">Phone</th>
            <th class="text-left px-5 py-3.5 text-xs
                       uppercase tracking-wider
                       text-zinc-500 font-medium">Role</th>
            <th class="text-left px-5 py-3.5 text-xs
                       uppercase tracking-wider
                       text-zinc-500 font-medium">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr>
            <td colspan="5" class="text-center py-16">
              <div class="spinner"
                   style="width:32px;height:32px;margin:auto">
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Create Admin Modal -->
<div id="createAdminModal"
     class="fixed inset-0 bg-black/70 backdrop-blur-sm
            z-50 hidden items-center justify-center"
     onclick="closeCreateAdminModal()">
  <div class="bg-zinc-900 border border-zinc-700
              rounded-2xl p-7 w-full max-w-md mx-4"
       onclick="event.stopPropagation()">
    <h2 class="font-display text-2xl text-white mb-5">
      Create Admin
    </h2>
    <div id="createAdminAlert"
         class="hidden mb-4 p-3 rounded-xl text-sm"></div>
    <div class="flex flex-col gap-4">
      <div>
        <label class="block text-xs text-zinc-400 mb-2
                      uppercase tracking-widest">
          First Name *
        </label>
        <input id="newAdminFirstName" type="text"
          placeholder="John"
          class="w-full bg-zinc-800 border border-zinc-700
                 rounded-xl px-4 py-3 text-white text-sm
                 outline-none placeholder-zinc-500
                 focus:border-violet-500 transition-colors"/>
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-2
                      uppercase tracking-widest">
          Last Name *
        </label>
        <input id="newAdminLastName" type="text"
          placeholder="Doe"
          class="w-full bg-zinc-800 border border-zinc-700
                 rounded-xl px-4 py-3 text-white text-sm
                 outline-none placeholder-zinc-500
                 focus:border-violet-500 transition-colors"/>
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-2
                      uppercase tracking-widest">
          Email *
        </label>
        <input id="newAdminEmail" type="email"
          placeholder="admin@example.com"
          class="w-full bg-zinc-800 border border-zinc-700
                 rounded-xl px-4 py-3 text-white text-sm
                 outline-none placeholder-zinc-500
                 focus:border-violet-500 transition-colors"/>
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-2
                      uppercase tracking-widest">
          Phone
        </label>
        <input id="newAdminPhone" type="tel"
          placeholder="9876543210"
          class="w-full bg-zinc-800 border border-zinc-700
                 rounded-xl px-4 py-3 text-white text-sm
                 outline-none placeholder-zinc-500
                 focus:border-violet-500 transition-colors"/>
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-2
                      uppercase tracking-widest">
          Password *
        </label>
        <input id="newAdminPassword" type="password"
          placeholder="Min 8 characters"
          class="w-full bg-zinc-800 border border-zinc-700
                 rounded-xl px-4 py-3 text-white text-sm
                 outline-none placeholder-zinc-500
                 focus:border-violet-500 transition-colors"/>
      </div>
    </div>
    <div class="flex gap-3 justify-end mt-6">
      <button onclick="closeCreateAdminModal()"
        class="px-5 py-2.5 rounded-xl text-sm
               font-medium text-zinc-300
               bg-zinc-800 border border-zinc-700
               hover:bg-zinc-700 transition-all">
        Cancel
      </button>
      <button onclick="handleCreateAdmin()"
        class="px-5 py-2.5 rounded-xl text-sm
               font-semibold text-white
               hover:opacity-90 transition-all"
        style="background:linear-gradient(135deg,#7c3aed,#4f46e5)">
        Create Admin
      </button>
    </div>
  </div>
</div>

<!-- Edit Admin Modal -->
<div id="editAdminModal"
     class="fixed inset-0 bg-black/70 backdrop-blur-sm
            z-50 hidden items-center justify-center"
     onclick="closeEditAdminModal()">
  <div class="bg-zinc-900 border border-zinc-700
              rounded-2xl p-7 w-full max-w-md mx-4"
       onclick="event.stopPropagation()">
    <h2 class="font-display text-2xl text-white mb-5">
      Edit Admin
    </h2>
    <div id="editAdminAlert"
         class="hidden mb-4 p-3 rounded-xl text-sm"></div>
    <div class="flex flex-col gap-4">
      <div>
        <label class="block text-xs text-zinc-400 mb-2
                      uppercase tracking-widest">
          First Name
        </label>
        <input id="editAdminFirstName" type="text"
          class="w-full bg-zinc-800 border border-zinc-700
                 rounded-xl px-4 py-3 text-white text-sm
                 outline-none focus:border-violet-500
                 transition-colors"/>
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-2
                      uppercase tracking-widest">
          Last Name
        </label>
        <input id="editAdminLastName" type="text"
          class="w-full bg-zinc-800 border border-zinc-700
                 rounded-xl px-4 py-3 text-white text-sm
                 outline-none focus:border-violet-500
                 transition-colors"/>
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-2
                      uppercase tracking-widest">
          Phone
        </label>
        <input id="editAdminPhone" type="tel"
          class="w-full bg-zinc-800 border border-zinc-700
                 rounded-xl px-4 py-3 text-white text-sm
                 outline-none focus:border-violet-500
                 transition-colors"/>
      </div>
    </div>
    <div class="flex gap-3 justify-end mt-6">
      <button onclick="closeEditAdminModal()"
        class="px-5 py-2.5 rounded-xl text-sm
               font-medium text-zinc-300
               bg-zinc-800 border border-zinc-700
               hover:bg-zinc-700 transition-all">
        Cancel
      </button>
      <button onclick="handleUpdateAdmin()"
        class="px-5 py-2.5 rounded-xl text-sm
               font-semibold text-white
               hover:opacity-90 transition-all"
        style="background:linear-gradient(135deg,#7c3aed,#4f46e5)">
        Save Changes
      </button>
    </div>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script>
  requireAuth('ADMIN');
  populateSidebarUser();

  let allUsers = [];
  let currentTab = 'all';
  let editingAdminId = null;

  // Load all users
  async function loadUsers() {
    try {
      allUsers = await UserAPI.getAll();
      renderUsers(allUsers);
      document.getElementById('userCount')
        .textContent = `${allUsers.length} users`;
    } catch (err) {
      document.getElementById('usersTableBody')
        .innerHTML = `
          <tr>
            <td colspan="5"
                class="text-center py-16 text-red-400 text-sm">
              ${escHtml(err.message)}
            </td>
          </tr>`;
    }
  }

  function renderUsers(users) {
    const tbody =
      document.getElementById('usersTableBody');
    if (!users.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5"
              class="text-center py-16 text-zinc-500">
            No users found
          </td>
        </tr>`;
      return;
    }

    tbody.innerHTML = users.map(u => `
      <tr class="border-b border-zinc-800/50
                 hover:bg-zinc-800/40 transition-all">
        <td class="px-5 py-4">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center
                        justify-center text-sm font-bold
                        flex-shrink-0 ${u.role === 'ADMIN'
                          ? 'text-white'
                          : 'text-yellow-900'}"
                 style="background:${u.role === 'ADMIN'
                   ? 'linear-gradient(135deg,#7c3aed,#4f46e5)'
                   : 'linear-gradient(135deg,#f59e0b,#d97706)'}">
              ${((u.firstName?.[0] || '') +
                 (u.lastName?.[0]  || '')).toUpperCase() || 'U'}
            </div>
            <div>
              <div class="text-sm font-medium text-white">
                ${escHtml(u.firstName || '')}
                ${escHtml(u.lastName  || '')}
              </div>
            </div>
          </div>
        </td>
        <td class="px-5 py-4 text-sm text-zinc-300">
          ${escHtml(u.email || '—')}
        </td>
        <td class="px-5 py-4 text-sm text-zinc-300">
          ${escHtml(u.phone || '—')}
        </td>
        <td class="px-5 py-4">
          <span class="text-xs px-2.5 py-1 rounded-full
                       font-medium ${u.role === 'ADMIN'
            ? 'bg-violet-400/10 text-violet-400 border border-violet-400/20'
            : 'bg-amber-400/10 text-amber-400 border border-amber-400/20'}">
            ${u.role || 'USER'}
          </span>
        </td>
        <td class="px-5 py-4">
          <div class="flex gap-2">
            ${u.role === 'ADMIN' ? `
            <button
              onclick="openEditAdminModal(${u.id},
                '${escHtml(u.firstName)}',
                '${escHtml(u.lastName)}',
                '${escHtml(u.phone || '')}')"
              class="w-8 h-8 rounded-lg flex items-center
                     justify-center text-sm transition-all
                     bg-violet-400/10 text-violet-400
                     border border-violet-400/20
                     hover:bg-violet-400/20"
              title="Edit Admin">✏️</button>
            ` : ''}
            <button
              onclick="confirmDeleteUser(${u.id},
                '${escHtml(u.firstName)} ${escHtml(u.lastName)}')"
              class="w-8 h-8 rounded-lg flex items-center
                     justify-center text-sm transition-all
                     bg-red-400/10 text-red-400
                     border border-red-400/20
                     hover:bg-red-400/20"
              title="Delete">🗑</button>
          </div>
        </td>
      </tr>`).join('');
  }

  // Search
  function searchUsers() {
    const q = document.getElementById('userSearch')
      ?.value?.toLowerCase().trim();
    let filtered = allUsers;

    if (currentTab === 'admins')
      filtered = allUsers.filter(u => u.role === 'ADMIN');
    else if (currentTab === 'users')
      filtered = allUsers.filter(u => u.role === 'USER');

    if (q) {
      filtered = filtered.filter(u =>
        (u.firstName || '').toLowerCase().includes(q) ||
        (u.lastName  || '').toLowerCase().includes(q) ||
        (u.email     || '').toLowerCase().includes(q)
      );
    }
    renderUsers(filtered);
  }

  // Tabs
  function showTab(tab) {
    currentTab = tab;
    const tabs = ['all', 'admins', 'users'];
    tabs.forEach(t => {
      const btn = document.getElementById(
        'tab' + t.charAt(0).toUpperCase() + t.slice(1));
      if (t === tab) {
        btn.className = `px-4 py-2 rounded-xl text-sm
          font-medium bg-violet-400/10 text-violet-400
          border border-violet-400/20`;
      } else {
        btn.className = `px-4 py-2 rounded-xl text-sm
          font-medium text-zinc-400 hover:text-white
          hover:bg-zinc-800 transition-all`;
      }
    });
    searchUsers();
  }

  // Delete user
  async function confirmDeleteUser(id, name) {
    if (!confirm(
      `Delete user "${name}"? This cannot be undone.`))
      return;
    try {
      await UserAPI.delete(id);
      showToast('User deleted successfully', 'success');
      loadUsers();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  // Create Admin Modal
  function openCreateAdminModal() {
    document.getElementById('newAdminFirstName').value = '';
    document.getElementById('newAdminLastName').value  = '';
    document.getElementById('newAdminEmail').value     = '';
    document.getElementById('newAdminPhone').value     = '';
    document.getElementById('newAdminPassword').value  = '';
    document.getElementById('createAdminAlert')
      .classList.add('hidden');
    const m = document.getElementById('createAdminModal');
    m.classList.remove('hidden');
    m.classList.add('flex');
  }

  function closeCreateAdminModal() {
    const m = document.getElementById('createAdminModal');
    m.classList.add('hidden');
    m.classList.remove('flex');
  }

  async function handleCreateAdmin() {
    const firstName =
      document.getElementById('newAdminFirstName')
        ?.value?.trim();
    const lastName  =
      document.getElementById('newAdminLastName')
        ?.value?.trim();
    const email    =
      document.getElementById('newAdminEmail')
        ?.value?.trim();
    const phone    =
      document.getElementById('newAdminPhone')
        ?.value?.trim();
    const password =
      document.getElementById('newAdminPassword')?.value;

    if (!firstName || !lastName || !email || !password) {
      showModalAlert('createAdminAlert',
        'First name, Last name, Email and Password are required.',
        'error');
      return;
    }

    if (password.length < 8) {
      showModalAlert('createAdminAlert',
        'Password must be at least 8 characters.', 'error');
      return;
    }

    try {
      // Create via auth-service register with ADMIN role
      await AuthAPI.register({
        firstName, lastName, email,
        phone, password, role: 'ADMIN'
      });
      closeCreateAdminModal();
      showToast('Admin created successfully!', 'success');
      loadUsers();
    } catch (err) {
      showModalAlert('createAdminAlert',
        err.message, 'error');
    }
  }

  // Edit Admin Modal
  function openEditAdminModal(id, firstName,
      lastName, phone) {
    editingAdminId = id;
    document.getElementById('editAdminFirstName')
      .value = firstName;
    document.getElementById('editAdminLastName')
      .value = lastName;
    document.getElementById('editAdminPhone')
      .value = phone;
    document.getElementById('editAdminAlert')
      .classList.add('hidden');
    const m = document.getElementById('editAdminModal');
    m.classList.remove('hidden');
    m.classList.add('flex');
  }

  function closeEditAdminModal() {
    const m = document.getElementById('editAdminModal');
    m.classList.add('hidden');
    m.classList.remove('flex');
  }

  async function handleUpdateAdmin() {
    const firstName =
      document.getElementById('editAdminFirstName')
        ?.value?.trim();
    const lastName  =
      document.getElementById('editAdminLastName')
        ?.value?.trim();
    const phone     =
      document.getElementById('editAdminPhone')
        ?.value?.trim();

    if (!firstName || !lastName) {
      showModalAlert('editAdminAlert',
        'First and Last name are required.', 'error');
      return;
    }

    try {
      await UserAPI.update(editingAdminId,
        { firstName, lastName, phone });
      closeEditAdminModal();
      showToast('Admin updated successfully!', 'success');
      loadUsers();
    } catch (err) {
      showModalAlert('editAdminAlert',
        err.message, 'error');
    }
  }

  function showModalAlert(id, msg, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.className = `mb-4 p-3 rounded-xl text-sm
      ${type === 'error'
        ? 'bg-red-400/10 text-red-400 border border-red-400/20'
        : 'bg-green-400/10 text-green-400 border border-green-400/20'}`;
    el.classList.remove('hidden');
  }

  loadUsers();
</script>
</body>
</html>
