<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Library Admin — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/custom.css"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Playfair Display', serif; }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #3f3f46;
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .fade-in { animation: fadeInUp 0.3s ease forwards; }
  </style>
</head>
<body class="bg-zinc-950 text-white">
<div class="flex min-h-screen">

  <!-- ── Sidebar ── -->
  <aside id="mainSidebar"
         class="fixed top-0 left-0 z-40 w-60 h-screen
                flex flex-col bg-zinc-900
                border-r border-zinc-800 px-4 py-6">

    <!-- Logo -->
    <div class="flex items-center gap-3 pb-6 mb-6
                border-b border-zinc-800">
      <div class="w-9 h-9 rounded-xl flex items-center
                  justify-center text-lg font-bold
                  text-white flex-shrink-0"
           style="background:linear-gradient(
                  135deg,#7c3aed,#4f46e5)">
        ⚙
      </div>
      <span class="font-display text-lg"
            style="color:#a78bfa">
        Admin Panel
      </span>
    </div>

    <!-- Nav Links -->
    <p class="text-[10px] uppercase tracking-widest
              text-zinc-500 px-2 mb-2">
      Admin Panel
    </p>

    <a href="dashboard.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              bg-violet-400/10 text-violet-400
              border border-violet-400/20">
      <img src="../../assets/icons/home.png"
           style="width:18px;height:18px;
                  filter:brightness(0) invert(1)"
           onerror="this.outerHTML='<span>📊</span>'"/>
      Dashboard
    </a>

    <a href="songs.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              text-zinc-400 hover:text-white
              hover:bg-zinc-800 transition-all">
      <img src="../../assets/icons/musical-note.png"
           style="width:18px;height:18px;
                  filter:brightness(0) invert(0.5)"
           onerror="this.outerHTML='<span>🎵</span>'"/>
      Manage Songs
    </a>
    <a href="users.html"
   class="flex items-center gap-3 px-3 py-2.5
          rounded-xl mb-1 text-sm font-medium
          text-zinc-400 hover:text-white
          hover:bg-zinc-800 transition-all">
  <span class="w-5 text-center">👥</span>
  Manage Users
</a>

    <a href="notifications.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              text-zinc-400 hover:text-white
              hover:bg-zinc-800 transition-all">
      <img src="../../assets/icons/active.png"
           style="width:18px;height:18px;
                  filter:brightness(0) invert(0.5)"
           onerror="this.outerHTML='<span>🔔</span>'"/>
      Notifications
    </a>

    <!-- Footer -->
    <div class="mt-auto pt-4 border-t border-zinc-800">
      <div class="flex items-center gap-3 px-3 py-2.5
                  bg-zinc-800 rounded-xl mb-3">
        <div id="sidebarAvatar"
             class="w-8 h-8 rounded-full flex items-center
                    justify-center text-xs font-bold
                    text-white flex-shrink-0"
             style="background:linear-gradient(
                    135deg,#7c3aed,#4f46e5)">
          A
        </div>
        <div class="min-w-0">
          <p id="sidebarUserName"
             class="text-sm font-medium
                    text-white truncate">
            Admin
          </p>
          <p id="sidebarUserRole"
             class="text-[10px] uppercase
                    tracking-wider text-zinc-500">
            Admin
          </p>
        </div>
      </div>
      <button onclick="handleLogout()"
        class="w-full flex items-center gap-3 px-3 py-2.5
               rounded-xl text-red-400 hover:text-red-300
               hover:bg-red-400/10 transition-all
               text-sm font-medium">
        <span class="w-5 text-center">↩</span>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- ── Main Content ── -->
  <main class="ml-60 flex-1 flex flex-col min-h-screen">

    <!-- ── Navbar ── -->
    <nav class="sticky top-0 z-50 flex items-center
                justify-between px-6 py-3
                bg-zinc-900/90 backdrop-blur-md
                border-b border-zinc-800">
      <div class="flex items-center gap-3">
        <h2 class="text-base font-medium text-white">
          Admin Dashboard
        </h2>
      </div>
      <div class="flex items-center gap-3">
        <!-- Search -->
        <div class="hidden md:flex items-center gap-2
                    bg-zinc-800 border border-zinc-700
                    rounded-xl px-3 py-2 min-w-[220px]">
          <img src="../../assets/icons/search.png"
               style="width:14px;height:14px;
                      filter:brightness(0) invert(0.5)"
               onerror="this.outerHTML='🔍'"/>
          <input type="text"
  id="navSearch"
  placeholder="Search songs…"
  oninput="handleAdminSearch(this.value)"
  onkeydown="if(event.key==='Enter')goToSongsSearch(this.value)"
  class="bg-transparent border-none outline-none
         text-white text-sm placeholder-zinc-500
         w-full"/>
        </div>
        <!-- User Pill -->
        <div class="flex items-center gap-2
                    bg-zinc-800 border border-zinc-700
                    rounded-xl px-3 py-1.5">
          <div id="navAvatar"
            class="w-7 h-7 rounded-full flex items-center
                   justify-center text-xs font-bold
                   text-white flex-shrink-0"
            style="background:linear-gradient(
                   135deg,#7c3aed,#4f46e5)">
            A
          </div>
          <span id="navUserName"
            class="hidden sm:block text-sm
                   font-medium text-white">
            Admin
          </span>
        </div>
      </div>
    </nav>

    <!-- ── Page Content ── -->
    <div class="p-8">

      <!-- Admin Banner -->
      <img src="../../assets/images/admin-banner.jpg"
           class="w-full h-40 object-cover
                  rounded-2xl mb-8 block"
           onerror="this.style.display='none'"/>

      <!-- Header -->
      <div class="mb-8">
        <h1 class="font-display text-3xl
                   text-white mb-1">
          Admin Dashboard
        </h1>
        <p class="text-zinc-400 text-sm">
          Overview of your music library
        </p>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-2 lg:grid-cols-4
                  gap-4 mb-8">
        <div class="bg-zinc-900 border border-zinc-800
                    rounded-2xl p-5 fade-in">
          <div class="font-display text-4xl
                      text-amber-400 mb-2"
               id="statTotalSongs">—</div>
          <div class="text-zinc-400 text-sm">
            Total Songs
          </div>
        </div>
        <div class="bg-zinc-900 border border-zinc-800
                    rounded-2xl p-5 fade-in"
             style="animation-delay:0.05s">
          <div class="font-display text-4xl
                      text-amber-400 mb-2"
               id="statVisibleSongs">—</div>
          <div class="text-zinc-400 text-sm">
            Visible to Users
          </div>
        </div>
        <div class="bg-zinc-900 border border-zinc-800
                    rounded-2xl p-5 fade-in"
             style="animation-delay:0.1s">
          <div class="font-display text-4xl
                      text-amber-400 mb-2"
               id="statHiddenSongs">—</div>
          <div class="text-zinc-400 text-sm">
            Restricted Songs
          </div>
        </div>
        <div class="bg-zinc-900 border border-zinc-800
                    rounded-2xl p-5 fade-in"
             style="animation-delay:0.15s">
          <div class="font-display text-4xl
                      text-amber-400 mb-2"
               id="statTotalUsers">—</div>
          <div class="text-zinc-400 text-sm">
            Registered Users
          </div>
        </div>
      </div>

      <!-- Recent Songs -->
      <div class="bg-zinc-900 border border-zinc-800
                  rounded-2xl p-6">
        <div class="flex items-center justify-between
                    mb-5">
          <h2 class="font-display text-xl text-white">
            Recent Songs
          </h2>
          <a href="songs.html"
             class="text-sm text-amber-400
                    hover:text-amber-300 transition-colors">
            Manage All →
          </a>
        </div>
        <div id="recentSongsList"
             class="flex flex-col gap-2">
          <div class="flex justify-center py-10">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/songs.js"></script>
<script>
  requireAuth('ADMIN');
  populateSidebarUser();

  // Populate navbar
  const user = getUser();
  if (user) {
    const initials = (
      (user.firstName?.[0] || '') +
      (user.lastName?.[0]  || '')
    ).toUpperCase() || 'A';
    const navAvatar =
      document.getElementById('navAvatar');
    const navName   =
      document.getElementById('navUserName');
    if (navAvatar) navAvatar.textContent = initials;
    if (navName)   navName.textContent   =
      user.firstName || user.email || 'Admin';
  }
  function handleAdminSearch(val) {
  const query = val.toLowerCase().trim();
  const rows = document.querySelectorAll(
    '#recentSongsList > div');

  if (!query) {
    // Show all rows
    rows.forEach(row => row.style.display = 'flex');
    return;
  }

  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display =
      text.includes(query) ? 'flex' : 'none';
  });
}

  async function loadDashboardStats() {
  try {
    const songs = await SongAPI.getAllAdmin(); // ← CHANGED
    const visible = songs.filter(
      s => s.visible !== false).length;

    document.getElementById('statTotalSongs')
      .textContent = songs.length;
    document.getElementById('statVisibleSongs')
      .textContent = visible;
    document.getElementById('statHiddenSongs')
      .textContent = songs.length - visible;

    const recent = songs.slice(-5).reverse();
    const container =
      document.getElementById('recentSongsList');

    container.innerHTML = recent.map((s, i) => `
      <div class="flex items-center gap-4 p-3
                  rounded-xl hover:bg-zinc-800
                  transition-all fade-in"
           style="animation-delay:${i * 0.05}s">
        <div class="text-zinc-500 text-sm
                    w-5 text-center flex-shrink-0">
          ${i + 1}
        </div>
        <div class="w-10 h-10 rounded-xl flex-shrink-0
                    overflow-hidden flex items-center
                    justify-center text-xl bg-zinc-800">
          ${s.albumArt
            ? `<img src="${s.albumArt}"
                    class="w-full h-full object-cover"
                    onerror="this.parentElement.innerHTML='🎵'">`
            : '🎵'
          }
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium
                      text-white truncate">
            ${escHtml(s.title || s.name)}
          </div>
          <div class="text-xs text-zinc-400 mt-0.5">
            ${escHtml(s.artist || s.singer || '—')}
          </div>
        </div>
        <div class="flex items-center gap-2
                    flex-shrink-0">
          <span class="text-xs px-2.5 py-1
                       rounded-full font-medium
                       ${s.visible !== false
            ? 'bg-green-400/10 text-green-400 border border-green-400/20'
            : 'bg-red-400/10 text-red-400 border border-red-400/20'}">
            ${s.visible !== false ? 'Visible' : 'Hidden'}
          </span>
          <a href="songs.html"
             class="text-xs text-zinc-500
                    hover:text-amber-400
                    transition-colors">
            Edit →
          </a>
        </div>
      </div>`).join('');

  } catch (err) {
    console.error(err);
    document.getElementById('recentSongsList')
      .innerHTML = `
        <div class="text-center py-10 text-zinc-500">
          <div class="text-3xl mb-2">⚠️</div>
          <p class="text-sm">${escHtml(err.message)}</p>
        </div>`;
  }

  try {
    const users = await UserAPI.getAll();
    document.getElementById('statTotalUsers')
      .textContent = users.length;
  } catch (_) {
    document.getElementById('statTotalUsers')
      .textContent = '—';
  }
}

// Search functions
function handleAdminSearch(val) {
  const query = val.toLowerCase().trim();
  const rows = document.querySelectorAll(
    '#recentSongsList > div');
  if (!query) {
    rows.forEach(row => row.style.display = 'flex');
    return;
  }
  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display =
      text.includes(query) ? 'flex' : 'none';
  });
}

function goToSongsSearch(val) {
  if (val.trim()) {
    sessionStorage.setItem(
      'adminSearchQuery', val.trim());
    window.location.href = 'songs.html';
  }
}

loadDashboardStats();
</script>
</body>
</html>
