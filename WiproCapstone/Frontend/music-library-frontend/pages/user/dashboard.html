<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Library — Song Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/custom.css"/>
</head>
<body class="bg-zinc-950 text-white">
<div class="flex min-h-screen">

  <!-- ── Sidebar ── -->
  <aside class="fixed top-0 left-0 z-40 w-60 h-screen
                flex flex-col bg-zinc-900
                border-r border-zinc-800 px-4 py-6">

    <!-- Logo -->
    <div class="flex items-center gap-3 pb-6 mb-6
                border-b border-zinc-800">
      <div class="w-9 h-9 rounded-xl flex items-center
                  justify-center text-lg font-bold
                  text-yellow-900"
           style="background:linear-gradient(
                  135deg,#f59e0b,#d97706)">
        ♪
      </div>
      <span class="font-display text-lg text-amber-400">
        Music Library
      </span>
    </div>

    <p class="text-[10px] uppercase tracking-widest
              text-zinc-500 px-2 mb-2">Discover</p>

    <a href="dashboard.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              bg-amber-400/10 text-amber-400
              border border-amber-400/20">
      <span class="w-5 text-center">🎵</span>
      Song Library
    </a>

    <p class="text-[10px] uppercase tracking-widest
              text-zinc-500 px-2 mb-2 mt-4">My Music</p>

    <a href="playlists.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              text-zinc-400 hover:text-white
              hover:bg-zinc-800 transition-all">
      <span class="w-5 text-center">📋</span>
      My Playlists
    </a>

    <a href="favorites.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              text-zinc-400 hover:text-white
              hover:bg-zinc-800 transition-all">
      <span class="w-5 text-center">❤️</span>
      Favorites
    </a>

    <a href="profile.html"
       class="flex items-center gap-3 px-3 py-2.5
              rounded-xl mb-1 text-sm font-medium
              text-zinc-400 hover:text-white
              hover:bg-zinc-800 transition-all">
      <span class="w-5 text-center">👤</span>
      Profile
    </a>

    <!-- Footer -->
    <div class="mt-auto pt-4 border-t border-zinc-800">
      <div class="flex items-center gap-3 px-3 py-2.5
                  bg-zinc-800 rounded-xl mb-3">
        <div id="sidebarAvatar"
             class="w-8 h-8 rounded-full flex items-center
                    justify-center text-xs font-bold
                    text-yellow-900 flex-shrink-0"
             style="background:linear-gradient(
                    135deg,#f59e0b,#d97706)">U</div>
        <div class="min-w-0">
          <p id="sidebarUserName"
             class="text-sm font-medium text-white truncate">
            Loading…
          </p>
          <p id="sidebarUserRole"
             class="text-[10px] uppercase tracking-wider
                    text-zinc-500">User</p>
        </div>
      </div>
      <button onclick="handleLogout()"
        class="w-full flex items-center gap-3 px-3 py-2.5
               rounded-xl text-red-400 hover:text-red-300
               hover:bg-red-400/10 transition-all
               text-sm font-medium">
        <span>↩</span> Sign Out
      </button>
    </div>
  </aside>

  <!-- ── Main Content ── -->
  <main class="ml-60 flex-1 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 flex items-center
                justify-between px-6 py-3
                bg-zinc-900/90 backdrop-blur-md
                border-b border-zinc-800">
      <h2 class="text-base font-medium text-white">
        Song Library
      </h2>
      <div class="flex items-center gap-3">

        <!-- Notification Bell -->
        <div style="position:relative">
          <button onclick="toggleNotifDropdown()"
            class="w-9 h-9 flex items-center justify-center
                   rounded-xl bg-zinc-800 border
                   border-zinc-700 text-base
                   hover:bg-zinc-700 transition-all">
            🔔
            <span id="notifDot"
              style="display:none;position:absolute;
                     top:6px;right:6px;width:8px;height:8px;
                     background:#f59e0b;border-radius:50%">
            </span>
          </button>
          <!-- Notification Dropdown -->
          <div id="notifDropdown"
            style="display:none;position:absolute;
                   top:48px;right:0;width:300px;
                   background:#18181b;
                   border:1px solid #3f3f46;
                   border-radius:16px;
                   box-shadow:0 16px 40px rgba(0,0,0,0.5);
                   overflow:hidden;z-index:999">
            <div style="padding:14px 16px;
                        border-bottom:1px solid #3f3f46;
                        font-size:14px;font-weight:600;
                        color:white">
              Notifications
            </div>
            <div id="notifList"
                 style="max-height:280px;overflow-y:auto;
                        padding:8px">
              <div style="text-align:center;padding:24px;
                          color:#52525b;font-size:13px">
                Loading…
              </div>
            </div>
          </div>
        </div>

        <!-- User Pill -->
        <button onclick="window.location.href='profile.html'"
          class="flex items-center gap-2 bg-zinc-800
                 border border-zinc-700 rounded-xl
                 px-3 py-1.5 hover:bg-zinc-700
                 transition-all">
          <div id="navAvatar"
            class="w-7 h-7 rounded-full flex items-center
                   justify-center text-xs font-bold
                   text-yellow-900 flex-shrink-0"
            style="background:linear-gradient(
                   135deg,#f59e0b,#d97706)">U</div>
          <span id="navUserName"
            class="text-sm font-medium text-white">
            User
          </span>
        </button>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="p-8 pb-32">


      <!-- Header + Search (ONE search bar only) -->
      <div class="flex items-center justify-between
                  flex-wrap gap-4 mb-6">
        <div>
          <h1 class="font-display text-3xl text-white mb-1">
            Song Library
          </h1>
          <p class="text-zinc-400 text-sm" id="songCount">
            Loading songs…
          </p>
        </div>

        <!-- Search + Filter combined -->
        <div class="flex items-center"
             style="background:#1e1e1e;
                    border:1px solid rgba(255,255,255,0.07);
                    border-radius:14px;overflow:hidden">
          <div class="flex items-center gap-2 px-4 py-2.5">
            <span style="color:#52525b;font-size:14px">🔍</span>
            <input type="text"
              id="searchInput"
              placeholder="Search songs, artists…"
              oninput="debounceSearch(this.value)"
              style="background:none;border:none;outline:none;
                     color:#f1f1f1;font-size:14px;width:200px;
                     font-family:'DM Sans',sans-serif"/>
          </div>
          <div style="width:1px;height:28px;
                      background:rgba(255,255,255,0.07)">
          </div>
          <select id="searchField"
            onchange="debounceSearch(
              document.getElementById('searchInput').value)"
            style="background:none;border:none;outline:none;
                   color:#a1a1aa;font-size:13px;
                   padding:10px 12px;cursor:pointer;
                   font-family:'DM Sans',sans-serif">
            <option value="q">All Fields</option>
            <option value="artist">Artist</option>
            <option value="album">Album</option>
            <option value="musicDirector">Music Director</option>
          </select>
        </div>
      </div>

      <!-- Songs Grid -->
      <div id="songsList"
           style="display:grid;
                  grid-template-columns:repeat(auto-fill,
                    minmax(180px,1fr));
                  gap:20px;padding:8px">
        <div style="grid-column:1/-1;display:flex;
                    justify-content:center;padding:60px">
          <div class="spinner"
               style="width:32px;height:32px"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add to Playlist Modal -->
<div id="addToPlaylistModal"
     style="display:none;position:fixed;inset:0;
            background:rgba(0,0,0,0.7);z-index:1000;
            align-items:center;justify-content:center"
     onclick="closeAddToPlaylistModal()">
  <div style="background:#18181b;border:1px solid #3f3f46;
              border-radius:20px;padding:24px;
              width:100%;max-width:400px;margin:16px"
       onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;
                justify-content:space-between;margin-bottom:16px">
      <h2 style="font-family:'Playfair Display',serif;
                 font-size:18px;color:white">
        Add to Playlist
      </h2>
      <button onclick="closeAddToPlaylistModal()"
        style="background:none;border:none;color:#71717a;
               font-size:18px;cursor:pointer">✕</button>
    </div>
    <div id="playlistPickerList"
         style="display:flex;flex-direction:column;gap:4px;
                max-height:320px;overflow-y:auto"></div>
    <div style="margin-top:16px;text-align:center">
      <a href="playlists.html"
         style="font-size:13px;color:#f59e0b">
        + Create New Playlist
      </a>
    </div>
  </div>
</div>

<!-- Player Bar -->
<div class="player-bar" id="mainPlayerBar">
  <div class="player-song-info">
    <div class="player-thumb" id="playerThumb">🎵</div>
    <div>
      <div style="font-size:13px;font-weight:500;
                  color:var(--text-primary)"
           id="playerSongName">—</div>
      <div style="font-size:11px;color:var(--text-secondary)"
           id="playerSongArtist">—</div>
    </div>
  </div>
  <div class="player-controls">
    <div class="player-btns">
      <button class="player-btn" id="playerShuffleBtn">⇄</button>
      <button class="player-btn" id="playerPrevBtn">⏮</button>
      <button class="player-btn play-btn" id="playerPlayBtn">▶</button>
      <button class="player-btn" id="playerNextBtn">⏭</button>
      <button class="player-btn" id="playerStopBtn">⏹</button>
      <button class="player-btn" id="playerRepeatBtn">↻</button>
    </div>
    <div class="progress-bar-wrap">
      <span class="progress-time" id="progressCurrent">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-time" id="progressTotal">0:00</span>
    </div>
  </div>
  <div class="player-volume">
    <span id="volumeIcon">🔊</span>
    <input type="range" class="volume-slider"
           id="volumeSlider" min="0" max="100" value="80"/>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/songs.js"></script>
<script src="../../js/player.js"></script>
<script>
  requireAuth('USER');
  populateSidebarUser();
  loadSongs();

  // Populate navbar user info
  const user = getUser();
  if (user) {
    const initials = (
      (user.firstName?.[0] || '') +
      (user.lastName?.[0]  || '')
    ).toUpperCase() || 'U';
    const el1 = document.getElementById('navAvatar');
    const el2 = document.getElementById('navUserName');
    if (el1) el1.textContent = initials;
    if (el2) el2.textContent =
      user.firstName || user.email || 'User';
  }

  // ── Search with debounce ──────────────────────────────────
  let searchTimer;
  function debounceSearch(val) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const field = document.getElementById('searchField')
        ?.value || 'q';
      searchSongs(val, field);
    }, 350);
  }

  // ── Add to Playlist Modal ─────────────────────────────────
  let _pendingSongId = null;

  function openAddToPlaylistModal(songId) {
    _pendingSongId = songId;
    const modal = document.getElementById('addToPlaylistModal');
    if (modal) modal.style.display = 'flex';

    const listEl = document.getElementById('playlistPickerList');
    listEl.innerHTML = `
      <div style="display:flex;justify-content:center;padding:20px">
        <div class="spinner" style="width:24px;height:24px"></div>
      </div>`;

    PlaylistAPI.getAll().then(playlists => {
      if (!playlists.length) {
        listEl.innerHTML = `
          <div style="text-align:center;padding:24px;
                      color:#71717a;font-size:13px">
            No playlists yet.
            <a href="playlists.html"
               style="color:#f59e0b;display:block;
                      margin-top:8px">
              Create one →
            </a>
          </div>`;
        return;
      }
      listEl.innerHTML = playlists.map(p => `
        <div onclick="addSongToPlaylist(${p.id})"
             style="display:flex;align-items:center;gap:12px;
                    padding:10px 12px;border-radius:10px;
                    cursor:pointer;transition:background 0.15s"
             onmouseover="this.style.background='#27272a'"
             onmouseout="this.style.background='none'">
          <div style="font-size:20px">🎵</div>
          <div>
            <div style="font-size:14px;font-weight:500;
                        color:white">${escHtml(p.name)}</div>
            <div style="font-size:12px;color:#71717a">
              ${p.songCount || 0} songs
            </div>
          </div>
          <div style="margin-left:auto;color:#f59e0b;
                      font-size:18px">＋</div>
        </div>`).join('');
    }).catch(err => {
      listEl.innerHTML = `
        <p style="color:#f87171;text-align:center;
                  padding:16px;font-size:13px">
          ${escHtml(err.message)}
        </p>`;
    });
  }

  async function addSongToPlaylist(playlistId) {
    if (!_pendingSongId) return;
    try {
      await PlaylistAPI.addSong(playlistId, _pendingSongId);
      closeAddToPlaylistModal();
      showToast('Song added to playlist!', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function closeAddToPlaylistModal() {
    const modal = document.getElementById('addToPlaylistModal');
    if (modal) modal.style.display = 'none';
    _pendingSongId = null;
  }

  // ── Notifications ─────────────────────────────────────────
  let notifOpen = false;

  function toggleNotifDropdown() {
    const dropdown = document.getElementById('notifDropdown');
    notifOpen = !notifOpen;
    dropdown.style.display = notifOpen ? 'block' : 'none';
    if (notifOpen) loadUserNotifications();
  }

  async function loadUserNotifications() {
    const list = document.getElementById('notifList');
    try {
      const notifs = await NotificationAPI.getAll();
      if (!notifs.length) {
        list.innerHTML = `
          <div style="text-align:center;padding:24px;
                      color:#52525b;font-size:13px">
            No notifications yet
          </div>`;
        return;
      }
      // Show dot
      document.getElementById('notifDot').style.display = 'block';
      list.innerHTML = notifs.map(n => `
        <div style="padding:12px;border-radius:10px;
                    margin-bottom:4px;background:#1e1e1e">
          <div style="font-size:13px;font-weight:500;
                      color:white;margin-bottom:3px">
            ${escHtml(n.subject)}
          </div>
          <div style="font-size:12px;color:#a1a1aa">
            ${escHtml((n.message || '').substring(0, 70))}
            ${(n.message?.length > 70) ? '…' : ''}
          </div>
          <div style="font-size:11px;color:#52525b;
                      margin-top:4px">
            ${n.sentAt
              ? new Date(n.sentAt).toLocaleDateString('en-IN')
              : ''}
          </div>
        </div>`).join('');
    } catch (err) {
      list.innerHTML = `
        <div style="text-align:center;padding:24px;
                    color:#f87171;font-size:13px">
          Could not load notifications
        </div>`;
    }
  }

  // Close notification on outside click
  document.addEventListener('click', e => {
    const bell = e.target.closest('[onclick="toggleNotifDropdown()"]');
    const dropdown = document.getElementById('notifDropdown');
    if (!bell && notifOpen) {
      dropdown.style.display = 'none';
      notifOpen = false;
    }
  });
</script>
</body>
</html>
