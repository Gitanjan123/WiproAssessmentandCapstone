<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melodia — Favorites</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/custom.css"/>
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">♪</div>
      <span>Melodia</span>
    </div>
    <div class="nav-section-title">Discover</div>
    <a href="dashboard.html" class="nav-link">
      <span class="nav-icon">🎵</span> Song Library
    </a>
    <div class="nav-section-title">My Music</div>
    <a href="playlists.html" class="nav-link">
      <span class="nav-icon">📋</span> My Playlists
    </a>
    <a href="favorites.html" class="nav-link active">
      <span class="nav-icon">❤️</span> Favorites
    </a>
    <a href="profile.html" class="nav-link">
      <span class="nav-icon">👤</span> Profile
    </a>
    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="user-avatar" id="sidebarAvatar">U</div>
        <div>
          <div class="user-name" id="sidebarUserName">—</div>
          <div class="user-role" id="sidebarUserRole">User</div>
        </div>
      </div>
      <button onclick="handleLogout()" class="nav-link w-full mt-2"
        style="color:#f87171;border:none;background:none">
        <span class="nav-icon">↩</span> Sign Out
      </button>
    </div>
  </aside>

  <main class="main-content" style="padding-bottom:100px">
    <div class="page-header">
      <h1 class="page-title">Favorites</h1>
      <p class="page-subtitle" id="favCount">Loading…</p>
    </div>

    <div class="panel">
      <div id="favoritesList" style="display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;justify-content:center;padding:60px">
          <div class="spinner" style="width:32px;height:32px"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Player Bar -->
<div class="player-bar">
  <div class="player-song-info">
    <div class="player-thumb" id="playerThumb">🎵</div>
    <div>
      <div style="font-size:13px;font-weight:500;color:var(--text-primary)" id="playerSongName">—</div>
      <div style="font-size:11px;color:var(--text-secondary)" id="playerSongArtist">—</div>
    </div>
  </div>
  <div class="player-controls">
    <div class="player-btns">
      <button class="player-btn" id="playerShuffleBtn">⇄</button>
      <button class="player-btn" id="playerPrevBtn">⏮</button>
      <button class="player-btn play-btn" id="playerPlayBtn">▶</button>
      <button class="player-btn" id="playerNextBtn">⏭</button>
      <button class="player-btn" id="playerStopBtn">⏹</button>
      <button class="player-btn" id="playerRepeatBtn">↻</button>
    </div>
    <div class="progress-bar-wrap">
      <span class="progress-time" id="progressCurrent">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-time" id="progressTotal">0:00</span>
    </div>
  </div>
  <div class="player-volume">
    <span id="volumeIcon">🔊</span>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80"/>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/songs.js"></script>
<script src="../../js/player.js"></script>
<script>
  requireAuth('USER');
  populateSidebarUser();
  loadFavorites();

  async function loadFavorites() {
    const container = document.getElementById('favoritesList');
    try {
      // When backend ready: const favs = await GET('/user/favorites');
      const favs = [];

      document.getElementById('favCount').textContent = `${favs.length} songs`;

      if (!favs.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">❤️</div>
            <h3>No favorites yet</h3>
            <p>Like songs from the library to see them here</p>
            <a href="dashboard.html" class="btn-primary"
              style="display:inline-block;margin-top:16px;padding:10px 24px;
                     border-radius:12px;font-size:14px;text-decoration:none">
              Browse Library
            </a>
          </div>`;
        return;
      }

      container.innerHTML = favs.map((song, i) => `
        <div class="song-row" data-id="${song.id}">
          <div class="song-num">${i + 1}</div>
          <div class="song-thumb">
            ${song.albumArt ? `<img src="${song.albumArt}" alt="">` : '🎵'}
          </div>
          <div class="song-info">
            <div class="song-name">${escHtml(song.title || song.name)}</div>
            <div class="song-artist">${escHtml(song.artist || song.singer || '—')}</div>
          </div>
          <div class="song-meta">
            <div style="font-size:12px;color:var(--text-secondary)">${escHtml(song.album || '—')}</div>
            <div>${song.duration ? formatDuration(song.duration) : ''}</div>
          </div>
          <div class="song-actions" onclick="event.stopPropagation()">
            <button class="btn-icon" onclick="playFromLibrary(${song.id})" title="Play">▶</button>
            <button class="btn-icon" onclick="removeFavorite(${song.id})"
              title="Remove" style="color:#f87171">❤️</button>
          </div>
        </div>`).join('');
    } catch (err) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <h3>Error loading favorites</h3>
          <p>${escHtml(err.message)}</p>
        </div>`;
    }
  }

  async function removeFavorite(songId) {
    // Wire to: await DELETE(`/user/favorites/${songId}`);
    showToast('Removed from favorites', 'success');
    loadFavorites();
  }
</script>
</body>
</html>
