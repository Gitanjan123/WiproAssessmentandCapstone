<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melodia — Song Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/custom.css"/>
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">♪</div>
      <span>Melodia</span>
    </div>
    <a href="dashboard.html" class="nav-link"><span class="nav-icon">🎵</span> Song Library</a>
    <a href="playlists.html" class="nav-link"><span class="nav-icon">📋</span> My Playlists</a>
    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="user-avatar" id="sidebarAvatar">U</div>
        <div>
          <div class="user-name" id="sidebarUserName">—</div>
          <div class="user-role" id="sidebarUserRole">User</div>
        </div>
      </div>
      <button onclick="handleLogout()" class="nav-link w-full mt-2" style="color:#f87171;border:none;background:none">
        <span class="nav-icon">↩</span> Sign Out
      </button>
    </div>
  </aside>

  <main class="main-content" style="padding-bottom:100px">
    <div id="songDetail">
      <div class="flex justify-center py-20">
        <div class="spinner" style="width:32px;height:32px"></div>
      </div>
    </div>
  </main>
</div>

<!-- Add to Playlist Modal (reused) -->
<div class="modal-overlay" id="addToPlaylistModal" onclick="closeAddToPlaylistModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <h2 class="modal-title" style="margin:0">Add to Playlist</h2>
      <button class="btn-icon" onclick="closeAddToPlaylistModal()">✕</button>
    </div>
    <div id="playlistPickerList" style="display:flex;flex-direction:column;gap:4px;max-height:320px;overflow-y:auto"></div>
  </div>
</div>

<!-- Player Bar -->
<div class="player-bar">
  <div class="player-song-info">
    <div class="player-thumb" id="playerThumb">🎵</div>
    <div>
      <div style="font-size:13px;font-weight:500" id="playerSongName">—</div>
      <div style="font-size:11px;color:var(--text-secondary)" id="playerSongArtist">—</div>
    </div>
  </div>
  <div class="player-controls">
    <div class="player-btns">
      <button class="player-btn" id="playerShuffleBtn">⇄</button>
      <button class="player-btn" id="playerPrevBtn">⏮</button>
      <button class="player-btn play-btn" id="playerPlayBtn">▶</button>
      <button class="player-btn" id="playerNextBtn">⏭</button>
      <button class="player-btn" id="playerStopBtn">⏹</button>
      <button class="player-btn" id="playerRepeatBtn">↻</button>
    </div>
    <div class="progress-bar-wrap">
      <span class="progress-time" id="progressCurrent">0:00</span>
      <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-time" id="progressTotal">0:00</span>
    </div>
  </div>
  <div class="player-volume">
    <span id="volumeIcon">🔊</span>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80"/>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/songs.js"></script>
<script src="../../js/player.js"></script>
<script>
  requireAuth('USER');
  populateSidebarUser();
  loadSongDetail();
</script>
</body>
</html>
